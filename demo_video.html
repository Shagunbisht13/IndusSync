<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndusSync Demo Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1280px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: black;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .subtitle {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            width: 80%;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 1px 1px 2px black;
        }
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 10;
        }
        .play-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .play-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- We use an empty src initially, and set it on play so the animation starts from the beginning -->
        <img id="demoVideo" src="" alt="IndusSync Demo">
        
        <div id="subtitleText" class="subtitle"></div>

        <div id="playOverlay" class="play-overlay">
            <h1>IndusSync Feature Demo</h1>
            <p>Click below to start the automated video with subtitles.</p>
            <button class="play-btn" onclick="startDemo()">Play Demo Video</button>
        </div>
    </div>

    <script>
        const subtitles = [
            { time: 0, text: "Welcome to IndusSync — The AI-Powered Industrial Parts Platform." },
            { time: 3, text: "Secure, role-based enterprise access." },
            { time: 6, text: "Dashboard: Get a bird's-eye view of your entire catalog health." },
            { time: 9, text: "Live KPIs track your export-readiness and AI automation rates." },
            { time: 13, text: "Catalog: Let's fix a broken part entry." },
            { time: 16, text: "Click 'Fix with AI' to instantly enrich missing data." },
            { time: 20, text: "Import: Upload thousands of parts with automatic schema mapping." },
            { time: 25, text: "Inventory: Instantly spot low-stock items with visual alerts." },
            { time: 29, text: "Purchase Orders: Seamlessly auto-generate POs for low stock." },
            { time: 33, text: "Suppliers: Manage vendors and track sync health." },
            { time: 37, text: "Integrations: Push clean data to SAP, NetSuite, or Shopify." },
            { time: 42, text: "Analytics: Deep dive into data quality and automation performance." },
            { time: 48, text: "Audit Log: Complete traceability and compliance for every edit." },
            { time: 54, text: "IndusSync. Clean Data. Smarter Operations." },
            { time: 60, text: "" } // End
        ];

        let startTime = 0;
        let animationFrameId;

        function startDemo() {
            document.getElementById('playOverlay').style.display = 'none';
            // Start the WebP animation
            document.getElementById('demoVideo').src = 'demo.webp';
            
            startTime = performance.now();
            updateSubtitles();
        }

        function updateSubtitles() {
            const currentTime = (performance.now() - startTime) / 1000;
            const subtitleEl = document.getElementById('subtitleText');
            
            // Find the current subtitle
            let currentText = "";
            for (let i = 0; i < subtitles.length - 1; i++) {
                if (currentTime >= subtitles[i].time && currentTime < subtitles[i + 1].time) {
                    currentText = subtitles[i].text;
                    break;
                }
            }

            if (currentText) {
                subtitleEl.innerText = currentText;
                subtitleEl.style.opacity = 1;
            } else {
                subtitleEl.style.opacity = 0;
            }

            // Continue looping
            if (currentTime < 65) {
                animationFrameId = requestAnimationFrame(updateSubtitles);
            }
        }
    </script>
</body>
</html>
